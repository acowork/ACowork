[package]
name = "acowork-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

description = "Gateway - Agent lifecycle manager and IPC coordinator"

[features]
default = []
# Interactive CLI approval (dialoguer-based confirmation prompts)
interactive-cli = ["dialoguer"]

[[bin]]
name = "acowork-gateway"
path = "src/main.rs"

[dependencies]
acowork-core.workspace = true
acowork-mcp.workspace = true
acowork-mqtt-session = { workspace = true, features = ["rumqttc-0-25"] }
acowork-sign.workspace = true
acowork-vault.workspace = true
acowork-memory.workspace = true
secrecy.workspace = true
# Argon2id password hashing for user accounts (ADR-076 §决策 1). Same KDF
# family as acowork-vault; kept as its own dep so the account store can hash
# without going through the Vault's master-key path.
argon2 = "0.5"
tokio.workspace = true
async-trait.workspace = true
base64.workspace = true
urlencoding.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tracing-appender.workspace = true
chrono.workspace = true
anyhow.workspace = true
zip.workspace = true
# Fixed seed for the token-gate test fixture (`http::test_support`).
ed25519-dalek.workspace = true
parking_lot.workspace = true
toml.workspace = true
# SQLite for one-time data migration (permissions.db + cron_entries.db → .json).
# TODO: remove after all users have migrated (gateway v0.3+).
rusqlite.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
uuid.workspace = true
futures-util.workspace = true
rand.workspace = true
fs2 = "0.4"
libc.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
rumqttc.workspace = true
rumqttd.workspace = true
prost.workspace = true
sha2.workspace = true
tokio-stream.workspace = true
# `tokio_util::io::ReaderStream` streams a `tokio::fs::File` straight into
# `axum::body::Body::from_stream` for the user-chat attachment download
# route (`chat_api::download_attachment`). Lives in `tokio-util` rather
# than `tokio-stream`; tokio-stream's own lib.rs explicitly defers to
# tokio-util for `AsyncRead` ↔ `Stream` adapters.
tokio-util.workspace = true
ignore.workspace = true
regex.workspace = true
# Cross-platform async IP/interface change watcher (NotifyAddrChange on
# Windows, netlink on Linux, SCDynamicStore on macOS). Drives the
# advertise-host auto-refresh watchdog (ADR-080). `tokio` feature is
# required so `IfWatcher` is re-exported from the platform module.
if-watch = { version = "3", features = ["tokio"] }

# Hidden-echo password prompt for first-boot admin setup (TTY path).
# Cross-platform (macOS / Linux / Windows + msys2 / Git bash). Single-purpose
# crate, no transitive surprise. ADR-076 §决策 12 v2.
rpassword = "7"
# Best-effort stack-buffer wipe for the plaintext password we read from stdin
# or `--password-file`. ADR-076 §决策 12 v2.
zeroize = "1"

# Interactive CLI (feature-gated)
dialoguer = { workspace = true, optional = true }

[dev-dependencies]
acowork-sign = { workspace = true }
acowork-memory = { workspace = true }
# Re-declare with fast-derivation feature so test runs use weak Argon2id
# params (8 KiB / 1 iter / 1 thread) instead of production-grade (64 MB /
# 3 iter / 4 threads). Without this feature flag, `cfg(test)` would not
# propagate and vault tests would take ~4 s each due to Argon2id cost.
acowork-vault = { workspace = true, features = ["fast-derivation"] }
zip = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
futures-util = { workspace = true, features = ["tokio-io"] }
