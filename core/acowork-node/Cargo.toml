[package]
name = "acowork-node"
description = "ACowork Node Agent — per-machine Runtime process host (ADR-055)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Dependency red line (ADR-055 §6.20): this crate MUST NOT depend on
# `acowork-gateway`. Allowed: acowork-core, acowork-mqtt-session and
# generic third-party crates. Enforced by tests/dependency_redline.rs.
acowork-core = { workspace = true }
acowork-mqtt-session = { workspace = true }
acowork-sign = { workspace = true }
# Clone `Full` mode copies the agent's `private.sqlite` and then strips the
# session-meta + conversation-index rows out of it (a clone starts a fresh
# dialogue, not a continuation). The runtime that boots the cloned agent
# owns the same file; the node just prepares it.
acowork-sqlite = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# ADR-087: hidden password prompt for the headless `acowork-node start`
# credential exchange (same crate the Gateway's admin-setup uses).
rpassword = "7"
serde_yaml = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rumqttc = { workspace = true }
prost = { workspace = true }
futures-util = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }
# ADR-055 §6.4: the node reverse proxy (axum) + upstream fetch (reqwest).
# `axum` `ws` is NOT needed here — the LSP relay is a separate sidecar
# process (Phase 4, `sidecar/`); the proxy only forwards HTTP, and LSP
# WebSocket upgrades terminate at the relay.
axum = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Used by the clone-purge test to seed real session-meta / conversation-index
# rows before the clone runs. Runtime pulls the same crate transitively; the
# node needs it directly only in tests.
acowork-memory = { workspace = true }
# Router oneshot tests (proxy auth gate).
tower = { workspace = true }
