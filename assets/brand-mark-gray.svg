<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 96" width="396" height="96" role="img" aria-label="ACowork">
  <title>ACowork</title>
  <defs>
    <!--
      Monochrome gray mark for empty-chat backgrounds, single palette
      (dark-toned; reads well on both light and dark surfaces).
      All fills stay strictly within the black/gray band so the mark
      never introduces a hue into a neutral surface.

      Chip #3A3A3A → #2A2A2A, "A" 3-tone (circle #E8, left #C8, right #A8),
      wordmark #A8A8A8. Co (#C8C8C8) > work (#7A7A7A) so "A" first, "Co"
      second. The A gradient runs light (circle) → mid (left stroke) →
      dark (right stroke), mirroring the color variant's depth cue.
    -->
    <linearGradient id="bg" x1="14" y1="2" x2="98" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#2A2A2A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <!-- Apple-style bite: white reveals the dot; small black circle carves the C-notch.
         Small circle = half the big circle's diameter (5.1 = 10.2/2),
         cy = big cy (vertically centered, same horizontal line),
         cx + r = big cx + big r (right edge tangent to big circle's right edge)
         → cx = 56 + 10.2 − 5.1 = 61.1. -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="40" y="40" width="40" height="40">
      <rect x="40" y="40" width="40" height="40" fill="white"/>
      <circle cx="61.1" cy="54" r="5.1" fill="black"/>
    </mask>
  </defs>
  <!-- near-black neutral chip -->
  <rect x="14" y="2" width="84" height="84" rx="20" ry="20" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- in-mark A: two strokes + a circle (replaces the crossbar).
       A width = 48 (chip 84, ~12.5px visual margin each side).
       Circle moved up to be tangent to the inner edges of both diagonals; diameter 20.4.
       "A" is always the loudest element on the chip.
       Strokes are separated at the apex: the left stroke runs to the apex,
       the right stroke ends short with its own round cap (centerline end
       (63.4,34.8), ~16.5 px from the apex) leaving a ~3 px gap. -->
  <!-- "A" group: scaled to 90% (–10%) around the in-tile center (56,44).
       Includes both strokes AND the C-notch dot — the dot replaces the A's
       crossbar, so it must shrink with the strokes to keep the "A" as a
       single coherent glyph. (A bbox incl. dot: x 32→80, y 20→68, center
       exactly the icon-tile center.) Stroke-width / radius shrink together
       to preserve the stroke-to-edge ratio. -->
  <g transform="translate(56 44) scale(0.9) translate(-56 -44)">
    <path d="M32 68 L56 20"
          fill="none"
          stroke="#C8C8C8"
          stroke-width="10"
          stroke-linecap="round"/>
    <path d="M63.4 34.8 L80 68"
          fill="none"
          stroke="#A8A8A8"
          stroke-width="10"
          stroke-linecap="round"/>
    <circle cx="56" cy="54" r="10.2" fill="#E8E8E8" mask="url(#bite)"/>
  </g>
  <!-- wordmark: Co > work in weight to preserve the brand's emphasis order -->
  <text x="106" y="71"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="74"
        fill="#A8A8A8"
        letter-spacing="-2.1">
    <tspan fill="#C8C8C8">Co</tspan><tspan fill="#7A7A7A" dx="4">work</tspan>
  </text>
</svg>
