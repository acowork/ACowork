<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon source. Derived from assets/brand-mark.svg's icon tile
  (yellow rounded square + "A" + C-notch dot), but the icon now fills
  the entire 512x512 canvas so the rendered icon takes the maximum
  possible area on every platform. Regenerate platform icons with:
  (cd apps/acowork-desktop && npm run tauri icon ../../assets/app-icon.svg)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ACowork">
  <title>ACowork</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7C948"/>
      <stop offset="100%" stop-color="#F0A92E"/>
    </linearGradient>
    <!-- Bite-mask: white rect reveals the dot; small black circle carves the C-notch.
         Big circle: cx=256, bottom aligned with the strokes' bottom centerline
         (cy + r = 402) AND tangent to both strokes' inner edges. The two
         constraints solve to a unique radius:
         left inner-edge line 0.8944x + 0.4472y = 330.44 (stroke midline
         110,402→256,110 offset 30.5 toward center);  |0.8944·256 + 0.4472·cy
         − 330.44| = 402 − cy  →  cy = 332.84, r = 69.16 (both legs agree,
         symmetry). The original r=62 (bottom 379) was the same construction.
         Small circle: keeps its relative position inside the big circle
         (center 0.5r right of big center, vertically centered) and scales
         with it: r = 34.58, cx = 256 + 34.58 = 290.58, cy = 332.84. -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="186.84" y="263.68" width="138.32" height="138.32">
      <rect x="186.84" y="263.68" width="138.32" height="138.32" fill="white"/>
      <circle cx="290.58" cy="332.84" r="34.58" fill="black"/>
    </mask>
  </defs>
  <!-- Yellow rounded square: x=0,y=0,w=512,h=512 so the icon fills the canvas edge-to-edge.
       rx=122 keeps the same rounded-square proportion (20/84 in the brand-mark). -->
  <rect x="0" y="0" width="512" height="512" rx="122" ry="122" fill="url(#bg)"/>
  <!-- "A": two strokes that span ~58% of the icon height, vertically centered.
       stroke-width=61 is the exact scale-up of brand-mark.svg's 10 onto a
       512 canvas (10 × 512/84 = 60.95 ≈ 61), so the stroke-to-edge ratio
       matches the brand-mark (≈ 11.9 % of the chip side).
       The strokes are separated at the apex: the left stroke runs all the
       way to the apex (256,110) with its round cap; the right stroke ends
       short with its own round cap. Its centerline end (300.7,199.4) is
       100 px from the apex along the stroke axis, leaving a minimum
       clearance of ~19 px (≈ 1/3 stroke width) between the right cap and
       the left stroke's edge, plus a ~39 px gap between the two caps. -->
  <!-- "A" group: scaled to 90% (–10%) around the canvas center (256,256).
       Includes both strokes AND the C-notch dot — the dot replaces the A's
       crossbar (see brand-mark.svg), so it must shrink with the strokes to
       keep the "A" as a single coherent glyph. Grouping all three inside
       one transform also scales their stroke-width / radius uniformly,
       preserving the stroke-to-edge ratio. -->
  <g transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <path d="M110 402 L256 110"
          fill="none"
          stroke="#303030"
          stroke-width="61"
          stroke-linecap="round"/>
    <path d="M300.7 199.4 L402 402"
          fill="none"
          stroke="#606060"
          stroke-width="61"
          stroke-linecap="round"/>
    <circle cx="256" cy="332.84" r="69.16" fill="#404040" mask="url(#bite)"/>
  </g>
</svg>